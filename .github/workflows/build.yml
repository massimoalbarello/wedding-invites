name: build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: build:required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare
      - run: bun run build:linux
      - run: bun run test:binary
      - uses: actions/upload-artifact@v7
        with:
          name: nibrun-binary
          path: apps/web/dist/app
          if-no-files-found: error
  browser:
    name: browser:required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
          if-no-files-found: ignore
  publish-nibrun:
    name: publish:nibrun
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nibrun-release
      cancel-in-progress: false
    steps:
      - name: Download verified nibrun binary
        uses: actions/download-artifact@v8
        with:
          name: nibrun-binary

      - name: Publish rolling nibrun prerelease
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A slow build or rerun must not replace a newer main build.
          main_sha=$(gh api "repos/${GH_REPO}/commits/main" --jq .sha)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping superseded main build."
            exit 0
          fi

          notes="Built from ${GITHUB_SHA}. This binary is replaced after successful builds and browser checks on main."
          if gh release view nibrun-latest >/dev/null 2>&1; then
            gh release upload nibrun-latest app --clobber
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/nibrun-latest" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit nibrun-latest \
              --prerelease --latest=false --notes "$notes"
          else
            gh release create nibrun-latest app \
              --target "$GITHUB_SHA" \
              --title "nibrun deployment" \
              --prerelease --latest=false --notes "$notes"
          fi
